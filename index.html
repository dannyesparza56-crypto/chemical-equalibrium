<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HICE Logic Master</title>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --bg: #f1f5f9; --paper: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); padding: 15px; display: flex; justify-content: center; }
        .pwa-container { width: 100%; max-width: 480px; }
        .card { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; border-top: 5px solid var(--primary); }
        .mode-select { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .btn.active { background: var(--primary); color: white; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        #solve-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px;}
        #output { margin-top: 15px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; display: none; line-height: 1.8; color: #1e293b; }
        .math-line { margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 15px; }
        .math-header { font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; display: block; margin-bottom: 5px; }
        .highlight { font-weight: bold; background: #dbeafe; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="pwa-container">
    <div class="card">
        <h2 style="text-align:center; margin-top:0;">HICE Logic Master</h2>
        <div class="mode-select">
            <button class="btn active" onclick="setMode('hice', this)">H-I-C-E</button>
            <button class="btn" onclick="setMode('iced', this)">I-C-E-D</button>
            <button class="btn" onclick="setMode('icee', this)">I-C-E-E</button>
            <button class="btn" onclick="setMode('ice', this)">I-C-E</button>
        </div>
        <div id="inputs"></div>
        <button id="solve-btn" onclick="runSolve()">SHOW STEP-BY-STEP MATH</button>
    </div>
    <div id="output"></div>
</div>

<script>
    let mode = 'hice';
    const inputDiv = document.getElementById('inputs');
    const out = document.getElementById('output');

    const config = {
        hice: '<div><label>Moles</label><input type="number" id="v1"></div><div><label>Liters</label><input type="number" id="v2"></div><div><label>Target Kc</label><input type="number" id="v3"></div>',
        iced: '<div><label>Current Reactant (M)</label><input type="number" id="v1"></div><div><label>Current Product (M)</label><input type="number" id="v2"></div><div><label>Target Kc</label><input type="number" id="v3"></div>',
        icee: '<div><label>Equilibrium Reactant (M)</label><input type="number" id="v1"></div><div><label>Equilibrium Product (M)</label><input type="number" id="v2"></div>',
        ice: '<div><label>Initial M</label><input type="number" id="v1"></div><div><label>Target Kc</label><input type="number" id="v3"></div>'
    };

    function setMode(m, b) {
        mode = m;
        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        inputDiv.innerHTML = config[mode];
        out.style.display = 'none';
    }

    function runSolve() {
        const v1 = parseFloat(document.getElementById('v1').value);
        const v2 = document.getElementById('v2') ? parseFloat(document.getElementById('v2').value) : 0;
        const v3 = document.getElementById('v3') ? parseFloat(document.getElementById('v3').value) : 0;
        out.style.display = 'block';
        let html = "";

        if (mode === 'hice') {
            const M = v1 / v2;
            const rootK = Math.sqrt(v3);
            const x = (rootK * M) / (2 + (2 * rootK));
            html = `
                <div class="math-line"><span class="math-header">Step 1: Harvest (H)</span>${v1} moles ÷ ${v2} L = <span class="highlight">${M.toFixed(2)} M</span></div>
                <div class="math-line"><span class="math-header">Step 2: Square Root Shortcut</span>√${v3} = 2x / (${M.toFixed(2)} - 2x)<br>${rootK.toFixed(2)} = 2x / (${M.toFixed(2)} - 2x)</div>
                <div class="math-line"><span class="math-header">Step 3: Algebra Shuffle</span>${rootK.toFixed(2)} * (${M.toFixed(2)} - 2x) = 2x<br>${(rootK*M).toFixed(2)} - ${(2*rootK).toFixed(2)}x = 2x<br>${(rootK*M).toFixed(2)} = ${(2 + 2*rootK).toFixed(2)}x</div>
                <div class="math-line"><span class="math-header">Step 4: Result</span>x = <span class="highlight">${x.toFixed(4)}</span><br><b>Final Product (2x) = ${(2*x).toFixed(3)} M</b></div>
            `;
        } else if (mode === 'iced') {
            const Q = (v2 * v2) / (v1 * v1);
            const shift = Q < v3 ? "RIGHT (Making Products)" : "LEFT (Making Reactants)";
            html = `
                <div class="math-line"><span class="math-header">Step 1: Find Q (Current Quotient)</span>Q = [Prod]² / [React]²<br>Q = ${v2}² / ${v1}² = <span class="highlight">${Q.toFixed(3)}</span></div>
                <div class="math-line"><span class="math-header">Step 2: Compare Q to Target Kc</span>Target Kc = ${v3}<br>Current Q = ${Q.toFixed(3)}</div>
                <div class="math-line"><span class="math-header">Step 3: Direction Logic</span>Since Q ${Q < v3 ? "<" : ">"} Kc, the reaction shifts <span class="highlight">${shift}</span></div>
            `;
        } else if (mode === 'icee') {
            const kc = (v2 * v2) / (v1 * v1);
            html = `
                <div class="math-line"><span class="math-header">Step 1: Expression Setup</span>Kc = [Equil. Prod]² / [Equil. React]²</div>
                <div class="math-line"><span class="math-header">Step 2: Math Solve</span>Kc = ${v2}² / ${v1}²</div>
                <div class="math-line"><span class="math-header">Final Constant</span><b>Kc = <span class="highlight">${kc.toFixed(3)}</span></b></div>
            `;
        } else if (mode === 'ice') {
            const rootK = Math.sqrt(v3);
            const x = (rootK * v1) / (1 + rootK);
            html = `
                <div class="math-line"><span class="math-header">Step 1: Direct ICE Setup</span>√${v3} = x / (${v1} - x)</div>
                <div class="math-line"><span class="math-header">Step 2: Algebra</span>${rootK.toFixed(2)} * (${v1} - x) = x<br>${(rootK * v1).toFixed(2)} - ${rootK.toFixed(2)}x = x</div>
                <div class="math-line"><span class="math-header">Result</span><b>x = <span class="highlight">${x.toFixed(3)} M</span></b></div>
            `;
        }
        out.innerHTML = html;
    }
    setMode('hice', document.querySelector('.btn'));
</script>
</body>
</html>
