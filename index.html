<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HICE Method Solver</title>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --paper: #ffffff; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .pwa-container { width: 100%; max-width: 450px; }
        .card { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; border-top: 5px solid var(--primary); }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .btn { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .btn.active { background: var(--primary); color: white; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        #solve-btn { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        
        /* Math Display (Staples Pad Style) */
        #output { margin-top: 20px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; display: none; line-height: 1.8; color: #1e293b; }
        .step { margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 12px; }
        .step-title { font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; display: block; }
        .highlight { font-weight: bold; background: #dbeafe; padding: 2px 5px; border-radius: 4px; }
        .note { font-style: italic; color: #64748b; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="pwa-container">
    <div class="card">
        <h2 style="margin:0 0 15px 0; text-align:center">HICE Solver Pro</h2>
        <div class="mode-grid">
            <button class="btn active" onclick="setMode('hice', this)">H-I-C-E</button>
            <button class="btn" onclick="setMode('ice', this)">I-C-E</button>
            <button class="btn" onclick="setMode('iced', this)">I-C-E-D</button>
            <button class="btn" onclick="setMode('icee', this)">I-C-E-E</button>
        </div>
        <div id="inputs"></div>
        <button id="solve-btn" onclick="runLogic()">PLUG AND PLAY MATH</button>
    </div>
    <div id="output"></div>
</div>

<script>
    let mode = 'hice';
    const inputDiv = document.getElementById('inputs');
    const out = document.getElementById('output');

    const config = {
        hice: '<div><label>Moles</label><input type="number" id="v1" step="any"></div><div><label>Liters</label><input type="number" id="v2" step="any"></div><div><label>Target Kc</label><input type="number" id="v3" step="any"></div>',
        ice: '<div><label>Initial Molarity (M)</label><input type="number" id="v1" step="any"></div><div><label>Target Kc</label><input type="number" id="v2" step="any"></div>',
        iced: '<div><label>Start Reactant (M)</label><input type="number" id="v1" step="any"></div><div><label>Start Product (M)</label><input type="number" id="v2" step="any"></div><div><label>Known Kc</label><input type="number" id="v3" step="any"></div>',
        icee: '<div><label>Equil. Reactant (M)</label><input type="number" id="v1" step="any"></div><div><label>Equil. Product (M)</label><input type="number" id="v2" step="any"></div>'
    };

    function setMode(m, b) {
        mode = m;
        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        inputDiv.innerHTML = config[mode];
        out.style.display = 'none';
    }

    function runLogic() {
        const v1 = parseFloat(document.getElementById('v1').value);
        const v2 = document.getElementById('v2') ? parseFloat(document.getElementById('v2').value) : 1;
        const v3 = document.getElementById('v3') ? parseFloat(document.getElementById('v3').value) : 0;
        
        out.style.display = 'block';
        let html = "";

        if (mode === 'hice') {
            const M = v1 / v2;
            const rootK = Math.sqrt(v3);
            const x = (rootK * M) / (2 + (2 * rootK));
            html = `
                <div class="step"><span class="step-title">H - Harvest (Initial Pour)</span>${v1} moles ÷ ${v2} Liters = <span class="highlight">${M.toFixed(2)} M</span></div>
                <div class="step"><span class="step-title">I/C - Setup Chart Equation</span>√${v3} = 2x / (${M.toFixed(2)} - 2x)</div>
                <div class="step"><span class="step-title">Algebra Shuffle</span>${rootK.toFixed(2)} * (${M.toFixed(2)} - 2x) = 2x<br>${(rootK*M).toFixed(2)} - ${(2*rootK).toFixed(2)}x = 2x<br>${(rootK*M).toFixed(2)} = ${(2 + 2*rootK).toFixed(2)}x</div>
                <div class="step"><span class="step-title">E - Solution</span>x = <span class="highlight">${x.toFixed(4)}</span><br>Product Left (2x) = <span class="highlight">${(2*x).toFixed(3)} M</span></div>
                <div class="note">Note: If Kc > 1, the reaction favors the products.</div>
            `;
        } else if (mode === 'ice') {
            const rootK = Math.sqrt(v2);
            const x = (rootK * v1) / (1 + rootK);
            html = `
                <div class="step"><span class="step-title">I - Initial Pour</span>Molarity = <span class="highlight">${v1.toFixed(2)} M</span></div>
                <div class="step"><span class="step-title">C - Solve for x</span>√${v2} = x / (${v1.toFixed(2)} - x)</div>
                <div class="step"><span class="step-title">Algebra Shuffle</span>${rootK.toFixed(2)} * (${v1.toFixed(2)} - x) = x<br>${(rootK*v1).toFixed(2)} - ${rootK.toFixed(2)}x = x</div>
                <div class="step"><span class="step-title">E - Final Answer</span>x = <span class="highlight">${x.toFixed(4)}</span></div>
            `;
        } else if (mode === 'iced') {
            const Q = (v2 * v2) / (v1 * v1);
            const shift = Q < v3 ? "RIGHT (Products)" : "LEFT (Reactants)";
            html = `
                <div class="step"><span class="step-title">D - Determine Direction (Q vs Kc)</span>Q = ${v2}² / ${v1}² = <span class="highlight">${Q.toFixed(3)}</span></div>
                <div class="step"><span class="step-title">Comparison</span>Q (${Q.toFixed(2)}) vs Kc (${v3})</div>
                <div class="step"><span class="step-title">Result</span>Shift <span class="highlight">${shift}</span></div>
                <div class="note">If Q < Kc, the system moves right to make more product.</div>
            `;
        } else if (mode === 'icee') {
            const kc = (v2 * v2) / (v1 * v1);
            html = `
                <div class="step"><span class="step-title">E - Expression for Kc</span>Kc = [Product]² / [Reactant]²</div>
                <div class="step"><span class="step-title">Plug and Play</span>Kc = ${v2}² / ${v1}²</div>
                <div class="step"><span class="step-title">Result</span>Kc = <span class="highlight">${kc.toFixed(3)}</span></div>
                <div class="note">This tells you the balance of the reaction.</div>
            `;
        }
        out.innerHTML = html;
    }

    setMode('hice', document.querySelector('.btn'));
</script>
</body>
</html>
