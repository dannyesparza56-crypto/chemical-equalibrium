<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HICE Master Solver</title>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --paper: #ffffff; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 15px; display: flex; justify-content: center; }
        .pwa-container { width: 100%; max-width: 450px; }
        .card { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; border-top: 5px solid var(--primary); }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .btn { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .btn.active { background: var(--primary); color: white; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 15px; }
        #solve-btn { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #output { margin-top: 20px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; display: none; line-height: 1.8; }
        .step { margin-bottom: 15px; border-left: 3px solid var(--accent); padding-left: 12px; }
        .step-title { font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; display: block; }
        .highlight { font-weight: bold; background: #dbeafe; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="pwa-container">
    <div class="card">
        <h2 style="text-align:center; margin-top:0;">HICE Logic Pro</h2>
        <div class="mode-grid">
            <button class="btn active" id="hice-btn" onclick="setMode('hice')">H-I-C-E</button>
            <button class="btn" id="ice-btn" onclick="setMode('ice')">I-C-E</button>
            <button class="btn" id="iced-btn" onclick="setMode('iced')">I-C-E-D</button>
            <button class="btn" id="icee-btn" onclick="setMode('icee')">I-C-E-E</button>
        </div>
        <div id="inputs">
            <label>Moles</label><input type="number" id="v1" placeholder="e.g. 8.0">
            <label>Liters</label><input type="number" id="v2" placeholder="e.g. 4.0">
            <label>Target Kc</label><input type="number" id="v3" placeholder="e.g. 36.0">
        </div>
        <button id="solve-btn" onclick="runLogic()">PLUG AND PLAY MATH</button>
    </div>
    <div id="output"></div>
</div>

<script>
    let mode = 'hice';
    function setMode(m) {
        mode = m;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById(m + '-btn').classList.add('active');
        const inputs = document.getElementById('inputs');
        if(m === 'hice') {
            inputs.innerHTML = '<label>Moles</label><input type="number" id="v1"><label>Liters</label><input type="number" id="v2"><label>Target Kc</label><input type="number" id="v3">';
        } else if(m === 'ice') {
            inputs.innerHTML = '<label>Initial Molarity (M)</label><input type="number" id="v1"><label>Target Kc</label><input type="number" id="v2">';
        } else if(m === 'iced') {
            inputs.innerHTML = '<label>Start Reactant (M)</label><input type="number" id="v1"><label>Start Product (M)</label><input type="number" id="v2"><label>Known Kc</label><input type="number" id="v3">';
        } else {
            inputs.innerHTML = '<label>Equil. Reactant (M)</label><input type="number" id="v1"><label>Equil. Product (M)</label><input type="number" id="v2">';
        }
    }

    function runLogic() {
        const v1 = parseFloat(document.getElementById('v1').value);
        const v2 = document.getElementById('v2') ? parseFloat(document.getElementById('v2').value) : 1;
        const v3 = document.getElementById('v3') ? parseFloat(document.getElementById('v3').value) : 0;
        const out = document.getElementById('output');
        out.style.display = 'block';
        
        let html = "";
        if (mode === 'hice') {
            const M = v1 / v2;
            const rootK = Math.sqrt(v3);
            const x = (rootK * M) / (2 + 2 * rootK);
            html = `
                <div class="step"><span class="step-title">H - Harvest</span>${v1} mol ÷ ${v2} L = <span class="highlight">${M.toFixed(2)} M</span></div>
                <div class="step"><span class="step-title">Setup Equation</span>√${v3} = (2x) / (${M.toFixed(2)} - 2x)</div>
                <div class="step"><span class="step-title">Algebra Shuffle</span>${rootK.toFixed(2)} = 2x / (${M.toFixed(2)} - 2x)<br>${rootK.toFixed(2)}(${M.toFixed(2)} - 2x) = 2x<br>${(rootK*M).toFixed(2)} - ${(2*rootK).toFixed(2)}x = 2x<br>${(rootK*M).toFixed(2)} = ${(2 + 2*rootK).toFixed(2)}x</div>
                <div class="step"><span class="step-title">Final Results</span>x = <span class="highlight">${x.toFixed(4)}</span><br>Product Left = <span class="highlight">${(M - 2*x).toFixed(3)} M</span></div>
            `;
        } // ... other modes follow same logic flow
        out.innerHTML = html;
    }
</script>
</body>
</html>
