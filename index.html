<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HICE Logic Solver</title>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --paper: #ffffff; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .pwa-container { width: 100%; max-width: 480px; }
        .card { background: var(--paper); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; border-top: 6px solid var(--primary); }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 15px; }
        #solve-btn { width: 100%; padding: 18px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        /* Math Breakdown Styles */
        #output { margin-top: 20px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; display: none; line-height: 1.8; }
        .math-block { margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 15px; }
        .math-label { font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 8px; }
        .eq-display { font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.1rem; background: #f8fafc; padding: 10px; border-radius: 6px; display: block; margin: 10px 0; }
        .highlight { color: #1e293b; background: #fef08a; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="pwa-container">
    <div class="card">
        <h2 style="text-align:center; margin:0 0 20px 0;">HICE Logic Engine</h2>
        <div class="mode-grid">
            <button class="btn active" id="hice-btn" onclick="setMode('hice')">H-I-C-E</button>
            <button class="btn" id="ice-btn" onclick="setMode('ice')">I-C-E</button>
            <button class="btn" id="iced-btn" onclick="setMode('iced')">I-C-E-D</button>
            <button class="btn" id="icee-btn" onclick="setMode('icee')">I-C-E-E</button>
        </div>
        <div id="inputs">
            <label>Moles</label><input type="number" id="v1" step="any">
            <label>Liters</label><input type="number" id="v2" step="any">
            <label>Target Kc</label><input type="number" id="v3" step="any">
        </div>
        <button id="solve-btn" onclick="runAnalysis()">SOLVE STEP-BY-STEP</button>
    </div>
    <div id="output"></div>
</div>

<script>
    let currentMode = 'hice';
    function setMode(m) {
        currentMode = m;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById(m + '-btn').classList.add('active');
        const inputs = document.getElementById('inputs');
        if(m === 'hice') {
            inputs.innerHTML = '<label>Moles</label><input type="number" id="v1"><label>Liters</label><input type="number" id="v2"><label>Target Kc</label><input type="number" id="v3">';
        } else if(m === 'ice') {
            inputs.innerHTML = '<label>Initial Molarity (M)</label><input type="number" id="v1"><label>Target Kc</label><input type="number" id="v2">';
        } else if(m === 'iced') {
            inputs.innerHTML = '<label>Start Reactant (M)</label><input type="number" id="v1"><label>Start Product (M)</label><input type="number" id="v2"><label>Known Kc</label><input type="number" id="v3">';
        } else {
            inputs.innerHTML = '<label>Equil. Reactant (M)</label><input type="number" id="v1"><label>Equil. Product (M)</label><input type="number" id="v2">';
        }
    }

    function runAnalysis() {
        const v1 = parseFloat(document.getElementById('v1').value);
        const v2 = document.getElementById('v2') ? parseFloat(document.getElementById('v2').value) : 1;
        const v3 = document.getElementById('v3') ? parseFloat(document.getElementById('v3').value) : 0;
        const out = document.getElementById('output');
        out.style.display = 'block';
        
        let html = "";
        if (currentMode === 'hice') {
            const M = v1 / v2;
            const rootK = Math.sqrt(v3);
            const x = (rootK * M) / (2 + (2 * rootK));
            html = `
                <div class="math-block"><span class="math-label">1. Harvest (H)</span>${v1} mol / ${v2} L = <span class="eq-display">${M.toFixed(3)} M</span></div>
                <div class="math-block"><span class="math-label">2. Square Root Shortcut</span>√${v3} = 2x / (${M.toFixed(3)} - 2x)<br><span class="eq-display">${rootK.toFixed(3)} = 2x / (${M.toFixed(3)} - 2x)</span></div>
                <div class="math-block"><span class="math-label">3. Algebra Shuffle</span>Move bottom to left side:<br>${rootK.toFixed(3)}(${M.toFixed(3)} - 2x) = 2x<br>${(rootK*M).toFixed(3)} - ${(2*rootK).toFixed(3)}x = 2x<br><br>Add x terms together:<br>${(rootK*M).toFixed(3)} = ${(2 + 2*rootK).toFixed(3)}x</div>
                <div class="math-block"><span class="math-label">4. Final Answer</span>x = <span class="highlight">${x.toFixed(4)}</span><br>Equilibrium [Product] = <span class="highlight">${(2*x).toFixed(3)} M</span></div>
            `;
        }
        out.innerHTML = html;
    }
</script>
</body>
</html>
